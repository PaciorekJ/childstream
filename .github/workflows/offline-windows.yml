name: Windows offline checks

on:
  pull_request:
    branches: [master, codex/hardened-foundation, codex/transactional-installer]

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile and run offline launcher, installer, and feasibility tests
        shell: pwsh
        run: .\tests\offline.ps1
